name: Verify release and update Nexus
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag, e.g. v0.1.0
        required: true
        type: string
      publish_nexus:
        description: Upload a new version to Nexus (check existing files before retry)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nexus-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: target
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.target.outputs.tag }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python tests/test_release.py
      - name: Verify published files and prepare Nexus update
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          PUBLISH_NEXUS: ${{ github.event_name == 'release' || inputs.publish_nexus }}
          NEXUS_FILE_GROUP_ID: ${{ vars.NEXUS_FILE_GROUP_ID }}
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: python tools/prepare-release.py
      - name: Upload to Nexus Mods
        id: nexus
        if: steps.release.outputs.nexus_ready == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_GROUP_ID }}
          filename: ${{ steps.release.outputs.asset }}
          version: ${{ steps.release.outputs.version }}
          display_name: Cabin Chair Marker ${{ steps.release.outputs.version }}
          description: ${{ steps.release.outputs.notes }}
          mod_id: ${{ steps.release.outputs.mod_id }}
          changelog: ${{ steps.release.outputs.notes }}
          category: main
          allow_mod_manager_download: ${{ vars.NEXUS_VORTEX_READY == 'true' }}
          primary_mod_manager_download: ${{ vars.NEXUS_VORTEX_READY == 'true' }}
          show_requirements_pop_up: true
          archive_existing_version: true
          update_mod_version: true
      - name: Record Nexus acknowledgement
        if: steps.release.outputs.nexus_ready == 'true'
        env:
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        run: |
          if [ -z "$VERSION_ID" ]; then
            echo "::error::Nexus returned no uploaded version ID"
            exit 1
          fi
          echo "Nexus acknowledged uploaded version ID: $VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
